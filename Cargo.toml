[package]
name = "propeller"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "propeller"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
midir = "0.10"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
