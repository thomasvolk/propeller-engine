[workspace]
resolver = "2"
members = ["crates/propeller", "crates/propeller-clock", "crates/propeller-common"]

[workspace.package]
version = "0.9.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/thomasvolk/propeller-engine"
homepage = "https://github.com/thomasvolk/propeller-engine"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
midir = { version = "0.10", features = ["coremidi_send_timestamped"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
propeller-common = { path = "crates/propeller-common", version = "0.9.3" }
